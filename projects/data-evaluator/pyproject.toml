[project]
name = "data-evaluator"
version = "0.1.0"
description = "Detection evaluation for fin-stat-table-detector using Label Studio annotations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_evaluator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
