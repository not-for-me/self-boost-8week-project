[project]
name = "pdf-analyzer"
version = "0.1.0"
description = "PDF structure analyzer CLI tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docling>=2.70.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "reportlab>=4.0.0",
]

[project.scripts]
pdf-analyzer = "pdf_analyzer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_analyzer"]
