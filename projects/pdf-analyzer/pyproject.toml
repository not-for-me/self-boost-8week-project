[project]
name = "pdf-analyzer"
version = "0.1.0"
description = "PDF structure analyzer CLI tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pdfplumber>=0.11.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "reportlab>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
