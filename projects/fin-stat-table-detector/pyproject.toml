[project]
name = "fin-stat-table-detector"
version = "0.1.0"
description = "Financial statement table detector for PDF reports"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "click>=8.0.0",
    "docling>=2.0.0",
    "intervaltree>=3.1.0",
    "opencv-contrib-python-headless>=4.0.0",
    "pdf2image>=1.16.0",
    "pillow>=11.3.0",
    "pypdf>=5.0.0",
    "rich>=13.0.0",
]

[project.scripts]
fin-stat-table-detector = "fin_stat_table_detector.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests (isolated, fast)",
    "integration: Integration tests (multi-module, slower)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_stat_table_detector"]


